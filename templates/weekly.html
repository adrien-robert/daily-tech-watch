<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <title>Weekly Tech Digest · {{week_label}}</title>
    <meta name="description" content="{{description}}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📡%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/report.css?v={{asset_version}}">
</head>
<body>
    <!-- Generated by scripts/build.py from data/weekly/. Edit the data file or the template, not this page. -->
    <div class="container">
        <header class="header">
            <div class="branding">Stellar Web Solutions</div>
            <h1>Weekly Tech Digest</h1>
            <div class="header-rule"></div>
            <div class="header-meta">
                <span class="meta-date">{{week_label}}</span>
                <nav class="report-nav" aria-label="Other pages">
                    {{nav}}
                </nav>
            </div>
        </header>

        <section class="panel lede" aria-labelledby="ledeTitle">
            <h2 class="panel-title" id="ledeTitle">The week in brief</h2>
            <p>{{summary}}</p>
        </section>

{{actions}}

{{stories}}

{{missed}}

{{ahead}}

{{long_read}}

{{health}}

        <footer class="footer">
            <p>{{run}}</p>
            <p>Weekly Tech Digest · Stellar Web Solutions · <a href="archive.html">Archive</a></p>
        </footer>
    </div>
</body>
</html>
