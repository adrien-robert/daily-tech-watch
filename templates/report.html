<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <title>Daily Tech Watch · {{date_long}}</title>
    <meta name="description" content="{{description}}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📡%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/report.css?v={{asset_version}}">
</head>
<body>
    <!-- Generated by scripts/build.py from data/. Edit the data file or the template, not this page. -->
    <div class="container">
        <header class="header">
            <div class="branding">Stellar Web Solutions</div>
            <h1>Daily Tech Watch</h1>
            <div class="header-rule"></div>
            <div class="header-meta">
                <span class="meta-date">{{date_long}}</span>
                <nav class="report-nav" aria-label="Other reports">
                    {{nav}}
                </nav>
            </div>
            <div class="stats-strip">
                {{stats}}
            </div>
        </header>

{{top}}

{{actions}}

        <div class="filter-bar" id="filterBar" hidden>
            <span class="filter-bar-label">Filter</span>
        </div>

{{categories}}

{{closing}}

        <footer class="footer">
            <p>{{run}}</p>
            <p>Daily Tech Watch · Stellar Web Solutions · <a href="archive.html">Archive</a></p>
        </footer>
    </div>
    <script src="assets/report.js?v={{asset_version}}"></script>
</body>
</html>
